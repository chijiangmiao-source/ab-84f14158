name: orbit-isolation

services:
  # 浏览器页面：宿主端口可通过 WEB_PORT 环境变量配置（默认 8080）
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: orbit-isolation-web
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # 验收：单次运行，完成后以退出码报告结果
  #   docker compose up verify --exit-code-from verify
  verify:
    build:
      context: .
      dockerfile: verify/Dockerfile
    image: orbit-isolation-verify
    depends_on:
      web:
        condition: service_healthy
    environment:
      WEB_URL: http://web:8080
    restart: "no"
